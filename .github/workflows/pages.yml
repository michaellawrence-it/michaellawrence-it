name: Deploy workout tracker

# Pages Source is set to "GitHub Actions", so this workflow is what publishes
# the site. It uploads workout-tracker/ as the site root, which means the app
# lives at the root of the Pages URL. Any push touching workout-tracker/
# redeploys it.
#
# Note: no `enablement: true` on configure-pages. Pages is already enabled, and
# the Actions GITHUB_TOKEN is not permitted to create a Pages site anyway
# ("Resource not accessible by integration") — that needs a PAT.

on:
  push:
    branches:
      - claude/workout-tracking-app-ys4y6m
      - main
    paths:
      - 'workout-tracker/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the app
        uses: actions/upload-pages-artifact@v3
        with:
          path: workout-tracker

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
