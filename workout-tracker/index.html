<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPL Tracker</title>
<meta name="description" content="Push / Pull / Legs workout log with weekly variation and progressive-overload targets.">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<!-- iOS ignores SVG here; it needs a real PNG or you get a page screenshot. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="banner" class="banner" hidden></div>

<header class="topbar">
  <div>
    <h1 id="page-title">Today</h1>
    <div class="sub" id="page-sub"></div>
  </div>
  <div class="spacer"></div>
  <div id="page-actions" class="row"></div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<div class="rest-bar" id="rest-bar" hidden>
  <div class="time" id="rest-time">0:00</div>
  <div class="track"><div class="fill" id="rest-fill"></div></div>
  <button class="btn sm ghost" data-action="rest-add">+30s</button>
  <button class="btn sm ghost" data-action="rest-stop">Stop</button>
</div>

<nav class="tabbar">
  <a href="#/home" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
    <span>Today</span>
  </a>
  <a href="#/history" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
    <span>History</span>
  </a>
  <a href="#/progress" data-tab="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7.5 15 3.5-4 3 2.5L20 7"/></svg>
    <span>Progress</span>
  </a>
  <a href="#/settings" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/></svg>
    <span>Settings</span>
  </a>
</nav>

<div class="toast" id="toast" role="status"></div>

<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>
